name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SERVER_IMAGE: ghcr.io/${{ github.repository_owner }}/slopcoder-server
  AGENT_IMAGE: ghcr.io/${{ github.repository_owner }}/slopcoder-agent

jobs:
  test:
    runs-on: ripley-cloud
    steps:
      - uses: actions/checkout@v4
      - name: Rust tests
        run: cargo test --workspace
      - name: Frontend tests and build
        run: cd frontend && npm ci && npm run test && npm run build

  build-images:
    runs-on: ripley-cloud
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build binaries and images
        run: |
          cargo build --release -p slopcoder-server --target x86_64-unknown-linux-musl
          cargo build --release -p slopagent --target x86_64-unknown-linux-musl
          cd frontend && npm ci && npm run build && cd ..
          docker build -f Dockerfile.server -t slopcoder-server:ci .
          docker build -f Dockerfile.agent -t slopcoder-agent:ci .

  e2e:
    runs-on: ripley-cloud
    needs: build-images
    steps:
      - uses: actions/checkout@v4
      - name: Start system
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait --wait-timeout 60
      - name: Wait for coordinator
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/auth/me 2>/dev/null; then break; fi
            sleep 1
          done
      - name: Run E2E tests
        run: ./e2e/run.sh
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs > e2e-logs.txt
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs.txt
      - name: Teardown
        if: always()
        run: docker compose down -v

  push-images:
    runs-on: ripley-cloud
    needs: e2e
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push
        run: |
          docker tag slopcoder-server:ci ${{ env.SERVER_IMAGE }}:${{ github.sha }}
          docker tag slopcoder-server:ci ${{ env.SERVER_IMAGE }}:latest
          docker tag slopcoder-agent:ci ${{ env.AGENT_IMAGE }}:${{ github.sha }}
          docker tag slopcoder-agent:ci ${{ env.AGENT_IMAGE }}:latest
          docker push ${{ env.SERVER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.SERVER_IMAGE }}:latest
          docker push ${{ env.AGENT_IMAGE }}:${{ github.sha }}
          docker push ${{ env.AGENT_IMAGE }}:latest
